<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pearl Computer & Target Academy</title>
    <script>
      (function () {
        try {
          var currentFetch = window.fetch;
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                           Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');

          if (!descriptor || !descriptor.set) {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoFetch = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function () {
                  return protoFetch;
                },
                set: function (val) {
                  protoFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {
            console.warn('Fetch setter patch error:', err);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
